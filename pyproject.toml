[project]
name = "wavedesk"
version = "0.1.0"
description = "Reconcile published Elliott Wave analyst levels against a personal portfolio and write a daily brief."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
wavedesk = "wavedesk.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
